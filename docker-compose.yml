# Test bench: three sites. Each site has its own network (site_*) with a
# Postgres and a Conduit; only the Conduits share the "wan" network, so
# `docker network disconnect conduit_wan <container>` simulates a site
# losing its internet link while its local database keeps working.
x-postgres: &postgres
  image: postgres:16-alpine
  command: >
    postgres
    -c wal_level=logical
    -c track_commit_timestamp=on
    -c max_replication_slots=10
    -c max_wal_senders=10
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: conduit
    POSTGRES_DB: app
    TZ: Asia/Bangkok
  volumes:
    - ./testdata/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
    interval: 2s
    timeout: 3s
    retries: 30

x-conduit: &conduit
  build: .
  image: conduit:dev
  environment:
    CONDUIT_TOKEN: ${CONDUIT_TOKEN:-dev-secret-change-me}
  restart: unless-stopped
  mem_limit: 64m

services:
  pg-host:
    <<: *postgres
    networks: [site_host]
    ports: ["127.0.0.1:55432:5432"]

  conduit-host:
    <<: *conduit
    volumes: ["./config/host.yaml:/etc/conduit/conduit.yaml:ro"]
    networks: [site_host, wan]
    ports: ["127.0.0.1:7420:7420"]
    depends_on:
      pg-host: { condition: service_healthy }

  pg-local:
    <<: *postgres
    networks: [site_local]
    ports: ["127.0.0.1:55433:5432"]

  conduit-local:
    <<: *conduit
    volumes: ["./config/local.yaml:/etc/conduit/conduit.yaml:ro"]
    networks: [site_local, wan]
    ports: ["127.0.0.1:7421:7420"]
    depends_on:
      pg-local: { condition: service_healthy }

  # Third site, started later by the tests to exercise snapshot join.
  pg-branch:
    <<: *postgres
    profiles: [branch]
    networks: [site_branch]
    ports: ["127.0.0.1:55434:5432"]

  conduit-branch:
    <<: *conduit
    profiles: [branch]
    volumes: ["./config/branch.yaml:/etc/conduit/conduit.yaml:ro"]
    networks: [site_branch, wan]
    ports: ["127.0.0.1:7422:7420"]
    depends_on:
      pg-branch: { condition: service_healthy }

networks:
  site_host:
  site_local:
  site_branch:
  wan:
    name: conduit_wan

# Test bench: three sites. Each site has its own network (site_*) with a
# Postgres and a Conduit; only the Conduits share the "wan" network, so
# `docker network disconnect conduit_wan <container>` simulates a site
# losing its internet link while its local database keeps working.
#
# Sites talk to each other over TLS on 7443 (published as 744x for tests);
# the dashboard is plain HTTP on 7420 (published as 742x).
#
#   host   founds the cluster
#   local  joins with an invite code (LOCAL_INVITE), empty database
#   branch has nothing configured: found on the LAN, approved on a dashboard;
#          its Postgres starts WITHOUT the settings Conduit needs
x-pg-env: &pg-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: conduit
  POSTGRES_DB: app
  TZ: Asia/Bangkok

x-pg-health: &pg-health
  test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
  interval: 2s
  timeout: 3s
  retries: 30

x-conduit: &conduit
  build: .
  image: conduit:dev
  restart: unless-stopped
  mem_limit: 64m

services:
  pg-host:
    image: postgres:16-alpine
    command: postgres -c wal_level=logical -c track_commit_timestamp=on
    environment: *pg-env
    volumes: ["./testdata/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro"]
    healthcheck: *pg-health
    networks: [site_host]
    ports: ["127.0.0.1:55432:5432"]

  conduit-host:
    <<: *conduit
    environment:
      CONDUIT_NODE_ID: host
      CONDUIT_BOOTSTRAP: "true"
      CONDUIT_DATABASE: postgres://postgres:conduit@pg-host:5432/app?sslmode=disable
      CONDUIT_ADVERTISE: https://conduit-host:7443
      CONDUIT_ADMIN_PASSWORD: ${CONDUIT_ADMIN_PASSWORD:-admin}
    volumes: ["./config/host.yaml:/etc/conduit/conduit.yaml:ro"]
    networks: [site_host, wan]
    ports: ["127.0.0.1:7420:7420", "127.0.0.1:7440:7443"]
    depends_on: { pg-host: { condition: service_healthy } }

  pg-local:
    image: postgres:16-alpine
    command: postgres -c wal_level=logical -c track_commit_timestamp=on
    environment: *pg-env
    healthcheck: *pg-health
    networks: [site_local]
    ports: ["127.0.0.1:55433:5432"]

  conduit-local:
    <<: *conduit
    environment:
      CONDUIT_NODE_ID: local
      CONDUIT_JOIN: ${LOCAL_INVITE:-}
      CONDUIT_DATABASE: postgres://postgres:conduit@pg-local:5432/app?sslmode=disable
      CONDUIT_ADVERTISE: https://conduit-local:7443
      CONDUIT_ADMIN_PASSWORD: ${CONDUIT_ADMIN_PASSWORD:-admin}
    networks: [site_local, wan]
    ports: ["127.0.0.1:7421:7420", "127.0.0.1:7441:7443"]
    depends_on: { pg-local: { condition: service_healthy } }

  pg-branch:
    image: postgres:16-alpine
    environment: *pg-env
    healthcheck: *pg-health
    profiles: [branch]
    networks: [site_branch]
    ports: ["127.0.0.1:55434:5432"]

  conduit-branch:
    <<: *conduit
    profiles: [branch]
    environment:
      CONDUIT_NODE_ID: branch
      CONDUIT_DATABASE: postgres://postgres:conduit@pg-branch:5432/app?sslmode=disable
      CONDUIT_ADVERTISE: https://conduit-branch:7443
      CONDUIT_ADMIN_PASSWORD: ${CONDUIT_ADMIN_PASSWORD:-admin}
    networks: [site_branch, wan]
    ports: ["127.0.0.1:7422:7420", "127.0.0.1:7442:7443"]
    depends_on: { pg-branch: { condition: service_healthy } }

networks:
  site_host:
  site_local:
  site_branch:
  wan:
    name: conduit_wan
